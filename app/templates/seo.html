<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <title>AI YouTube Content Studio</title>
    <style>
      /* Fallback so page is not white if Tailwind CDN is blocked */
      body {
        margin: 0;
        min-height: 100vh;
        background: #020617;
        color: #e2e8f0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (!window.tailwind) {
        const fallback = document.createElement("script");
        fallback.src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4";
        document.head.appendChild(fallback);
      }
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main id="seo-app" class="mx-auto w-full max-w-6xl px-4 py-8 md:px-6 md:py-10"></main>
    <script type="module" src="{{ url_for('static', filename='js/seo-main.js', v='20260311') }}"></script>
  </body>
</html>
