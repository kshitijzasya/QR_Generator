<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <title>InsideBox Tools</title>
    <style>
      :root {
        --card-bg: #f5f6f8;
        --text: #101219;
        --muted: #808796;
        --line: #d7dbe3;
        --accent: #1d9bf0;
        --accent-soft: #dbf1ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(165deg, #1297ef 0%, #1297ef 58%, #f2e900 58%, #f2e900 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      .card {
        width: min(100%, 860px);
        border-radius: 14px;
        border: 2px solid #161922;
        background: var(--card-bg);
        box-shadow: 0 16px 24px rgba(0, 0, 0, 0.18);
        padding: 28px 36px;
      }

      .brand {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        font-weight: 700;
        font-size: 28px;
      }

      .brand-badge {
        width: 16px;
        height: 16px;
        transform: rotate(45deg);
        border-radius: 4px;
        background: linear-gradient(145deg, #0094ff 0%, #005ce6 100%);
      }

      h1 {
        margin: 20px 0 6px;
        font-size: 42px;
        line-height: 1.1;
      }

      .sub {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        margin-bottom: 20px;
      }

      .tab {
        position: relative;
        color: #98a0af;
        font-size: 13px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--line);
        border-top: 0;
        border-left: 0;
        border-right: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .tab.active {
        color: var(--accent);
        font-weight: 600;
        border-bottom-color: var(--accent);
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 13px;
        color: #5b6271;
        font-weight: 600;
      }

      .mode-group {
        display: grid;
        gap: 10px;
      }

      .mode-card {
        display: block;
        border: 1px solid #c7ccd5;
        border-radius: 10px;
        background: #fff;
        padding: 12px;
        cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .mode-card:hover {
        border-color: #80c7f6;
      }

      .mode-card input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .mode-card:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px rgba(29, 155, 240, 0.2);
      }

      .mode-title {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #1a2131;
      }

      .mode-copy {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: #5b6271;
      }

      .field,
      .select,
      .file {
        width: 100%;
        border: 1px solid #c7ccd5;
        border-radius: 6px;
        padding: 12px;
        font-size: 15px;
        background: #fff;
      }

      .file {
        padding: 10px;
      }

      .textarea {
        min-height: 96px;
        resize: vertical;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .color-wrap {
        border: 1px solid #c7ccd5;
        border-radius: 6px;
        background: #fff;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .color-wrap input {
        width: 44px;
        height: 34px;
        border: 0;
        padding: 0;
        background: transparent;
      }

      .color-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #454c5b;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 10px 22px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }

      .btn.secondary {
        background: #fff;
        border-color: #ccd2dc;
      }

      .btn.primary {
        background: var(--accent);
        color: #fff;
      }

      .preview {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid #d6dbe5;
        border-radius: 10px;
        background: #fff;
        display: none;
      }

      .preview.show {
        display: block;
      }

      .preview-head {
        font-weight: 700;
        margin-bottom: 10px;
      }

      .preview img {
        width: min(100%, 260px);
        height: auto;
        border: 1px solid #e3e7ef;
        border-radius: 8px;
        background: #fafbff;
      }

      .download-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .btn.download {
        background: var(--accent-soft);
        color: #005799;
      }

      .btn.download:disabled {
        background: #eceff4;
        color: #a0a8b7;
        cursor: not-allowed;
      }

      .error {
        margin-top: 10px;
        color: #cc2136;
        font-size: 13px;
        min-height: 18px;
      }

      .help {
        margin-top: 8px;
        color: #788091;
        font-size: 12px;
      }

      .module-tabs {
        margin-bottom: 18px;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .tool-card {
        border: 1px solid #cad1dd;
        border-radius: 12px;
        background: #fff;
        text-align: left;
        padding: 18px;
        cursor: pointer;
        display: grid;
        gap: 8px;
        transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }

      .tool-card:hover {
        border-color: #80c7f6;
        box-shadow: 0 10px 20px rgba(19, 39, 74, 0.12);
        transform: translateY(-1px);
      }

      .tool-kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #5d6b82;
      }

      .tool-title {
        font-size: 23px;
        font-weight: 700;
        color: #1a2131;
      }

      .tool-copy {
        color: #5a6374;
        font-size: 14px;
      }

      .tool-head {
        display: flex;
        justify-content: flex-end;
      }

      .back-btn {
        padding: 8px 14px;
        font-size: 12px;
      }

      .seo-results {
        margin-top: 18px;
        border: 1px solid #d6dbe5;
        border-radius: 10px;
        background: #fff;
        padding: 16px;
      }

      .seo-head {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .seo-text {
        margin: 0 0 14px;
        color: #232936;
        line-height: 1.5;
      }

      .seo-list {
        margin: 0 0 14px;
        padding-left: 18px;
      }

      .seo-list li {
        margin-bottom: 6px;
      }

      .site-footer {
        width: min(100%, 860px);
        margin-top: 16px;
        border: 2px solid #161922;
        border-radius: 14px;
        background: rgba(245, 246, 248, 0.94);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
      }

      .site-footer__inner {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 18px;
        padding: 20px 24px;
      }

      .site-footer__eyebrow,
      .site-footer__heading {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5d6b82;
        margin-bottom: 8px;
      }

      .site-footer__copy {
        margin: 0;
        color: #334155;
        font-size: 14px;
        line-height: 1.5;
      }

      .site-footer__links {
        display: grid;
        gap: 8px;
      }

      .site-footer__link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #1f2937;
        text-decoration: none;
        font-size: 14px;
      }

      .site-footer__link:hover {
        color: #005ce6;
      }

      .site-footer__link svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      @media (max-width: 760px) {
        .card {
          padding: 22px 18px;
        }

        h1 {
          font-size: 32px;
        }

        .grid-2 {
          grid-template-columns: 1fr;
        }

        .tool-grid {
          grid-template-columns: 1fr;
        }

        .site-footer__inner {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" class="card"></main>
    {% include "_site_footer.html" %}
    <script type="module" src="{{ url_for('static', filename='js/main.js', v='20260324vault') }}"></script>
  </body>
</html>
